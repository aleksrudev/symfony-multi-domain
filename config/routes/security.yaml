_security_logout:
    resource: security.route_loader.logout
    type: service

api_auth_session:
    path: /api/v1/auth/session
    controller: App\Shared\Presentation\Http\AuthController::session
    methods: [GET]

api_auth_login:
    path: /api/v1/auth/login
    controller: App\Shared\Presentation\Http\AuthController::login
    methods: [POST]
