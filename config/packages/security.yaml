security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        in_memory_users:
            memory:
                users:
                    buyer1:
                        password: '%env(DEMO_BUYER1_PASSWORD_HASH)%'
                        roles: ['ROLE_BUYER']
                    buyer2:
                        password: '%env(DEMO_BUYER2_PASSWORD_HASH)%'
                        roles: ['ROLE_BUYER']
                    admin:
                        password: '%env(DEMO_ADMIN_PASSWORD_HASH)%'
                        roles: ['ROLE_ADMIN']

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            stateless: false
            provider: in_memory_users
            json_login:
                check_path: /api/v1/auth/login
                username_path: username
                password_path: password
            logout:
                path: /api/v1/auth/logout
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/v1/auth/session, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/v1/auth/login, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/v1/products, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/v1/admin, roles: ROLE_ADMIN }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
