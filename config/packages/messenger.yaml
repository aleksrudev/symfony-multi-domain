framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: 'doctrine://default?queue_name=async'
                options:
                    auto_setup: false
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 3
                    max_delay: 30000
            sync: 'sync://'
            failed:
                dsn: 'doctrine://default?queue_name=failed'
                options:
                    auto_setup: false
        routing:
            'App\Shared\Presentation\Contracts\Event\IntegrationEventInterface': async
        default_bus: default.bus
        buses:
            default.bus:
                middleware:
                    - validation
            event.bus:
                default_middleware:
                    allow_no_handlers: true
                    allow_no_senders: false
                middleware:
                    - validation
                    - doctrine_ping_connection
            command.bus:
                middleware:
                    - validation
                    - doctrine_transaction
            query.bus:
                middleware:
                    - validation
