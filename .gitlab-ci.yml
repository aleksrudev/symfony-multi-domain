stages:
  - build
  - quality
  - test

variables:
  APP_ENV: test
  APP_SECRET: ci-only-secret
  DEFAULT_URI: http://localhost
  DATABASE_URL: 'postgresql://test:test@postgres:5432/template?serverVersion=16&charset=utf8'
  OUTBOX_TEST_DATABASE_URL: 'postgresql://test:test@postgres:5432/outbox_test?serverVersion=16&charset=utf8'
  MESSENGER_TRANSPORT_DSN: doctrine://default
  APP_RUNTIME_OPTIONS: '{"disable_dotenv":true}'

.php-base:
  image: php:8.4-cli
  before_script:
    - apt-get update -qq && apt-get install -yqq git unzip libpq-dev libicu-dev
    - docker-php-ext-install pdo_pgsql intl
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist --no-progress
  cache:
    key: composer-${CI_COMMIT_REF_SLUG}
    paths:
      - vendor/

composer-validate:
  stage: build
  extends: .php-base
  script:
    - composer validate --strict

phpstan:
  stage: quality
  extends: .php-base
  needs: [composer-validate]
  script:
    - vendor/bin/phpstan analyse --memory-limit=512M

cs-check:
  stage: quality
  extends: .php-base
  needs: [composer-validate]
  script:
    - vendor/bin/php-cs-fixer fix --dry-run --diff

architecture:
  stage: quality
  extends: .php-base
  needs: [composer-validate]
  script:
    - php bin/architecture

phpunit:
  stage: test
  extends: .php-base
  needs: [composer-validate]
  services:
    - postgres:16-alpine
  variables:
    POSTGRES_DB: template
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
  script:
    - php bin/test-db-prepare --confirm-test-database
    - DATABASE_URL='postgresql://test:test@postgres:5432/outbox?serverVersion=16&charset=utf8' php bin/test-db-prepare --confirm-test-database
    - vendor/bin/phpunit
    - php bin/console lint:container --env=test
    - php bin/console doctrine:schema:validate --skip-sync --env=test
    - php bin/console cache:warmup --env=prod --no-debug
    - php bin/console lint:container --env=prod --no-debug
