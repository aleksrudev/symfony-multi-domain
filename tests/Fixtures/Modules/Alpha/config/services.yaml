parameters:
    alpha.origin: module
services:
    _defaults:
        autowire: true
        autoconfigure: true
    App\Shared\Application\Bus\Command\CommandBusInterface:
        alias: App\Shared\Infrastructure\Bus\Symfony\CommandMessageBus
        public: true
    App\Shared\Application\Bus\Query\QueryBusInterface:
        alias: App\Shared\Infrastructure\Bus\Symfony\QueryMessageBus
        public: true
    Tests\Fixtures\Modules\Alpha\Application\ProbeHandler:
        public: true
    Tests\Fixtures\Modules\Alpha\Application\:
        resource: '../Application/*Handler.php'
        exclude: '../Application/ProbeHandler.php'
    Tests\Fixtures\Modules\Alpha\Infrastructure\Messaging\:
        resource: '../Infrastructure/Messaging/'
    Tests\Fixtures\Modules\Alpha\Presentation\Http\ProbeController:
        tags: [controller.service_arguments]
    Tests\Fixtures\Modules\Alpha\Infrastructure\ProbeSchedule: ~
    Tests\Fixtures\Modules\Alpha\Presentation\Http\ProbeErrors: ~
    Tests\Fixtures\Modules\Alpha\Infrastructure\ProbeStore: ~
    Tests\Fixtures\Modules\Alpha\Application\ProbeStoreInterface: "@Tests\\Fixtures\\Modules\\Alpha\\Infrastructure\\ProbeStore"
when@test:
    parameters:
        alpha.origin: module-test
