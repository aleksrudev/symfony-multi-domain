---
services:
  php:
    image: ${APP_NAME}-php-${APP_ENV}
    build:
      context: .
      target: frankenphp_dev
    container_name: ${APP_NAME}-php-${APP_ENV}
    restart: unless-stopped
    depends_on:
      - database
    networks:
      - default
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
      DEFAULT_URI: https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      # Run "composer require symfony/orm-pack" to install and configure Doctrine ORM
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-15}&charset=${POSTGRES_CHARSET:-utf8}
      # Run "composer require symfony/mercure-bundle" to install and configure the Mercure integration
      MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}/.well-known/mercure}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      ###> dunglas/symfony-docker ###
      # Next lines are only used during initial installation
      # This block will remove itself after the installation
      SYMFONY_VERSION: ${SYMFONY_VERSION:-}
      STABILITY: ${STABILITY:-stable}
      ###< dunglas/symfony-docker ###
      CADDY_GLOBAL_OPTIONS: "${CADDY_GLOBAL_OPTIONS:-auto_https off}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
        host_ip: ${HOST_IP}
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
        host_ip: ${HOST_IP}
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp
        host_ip: ${HOST_IP}
  scheduler:
    image: ${APP_NAME}-php-${APP_ENV}:latest
    container_name: ${APP_NAME}-scheduler-${APP_ENV}
    restart: always
    profiles:
      - worker
    environment:
      SYMFONY_VERSION: ${SYMFONY_VERSION:-}
      STABILITY: ${STABILITY:-stable}
    depends_on:
      - database
      - php
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'messenger:consume' | grep -v grep || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./var:/app/var/
    command: ["php", "bin/console", "messenger:consume", "scheduler_default", "-vv", "--limit=100", "--time-limit=3600"]
  worker:
    image: ${APP_NAME}-php-${APP_ENV}:latest
    container_name: ${APP_NAME}-worker-${APP_ENV}
    restart: always
    profiles:
      - worker
    environment:
      SYMFONY_VERSION: ${SYMFONY_VERSION:-}
      STABILITY: ${STABILITY:-stable}
    depends_on:
      - database
      - php
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'messenger:consume' | grep -v grep || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./var:/app/var/
    command: ['php', 'bin/console', 'messenger:consume', 'async', '-vv', '--limit=100', '--memory-limit=128M', '--time-limit=3600']

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: ${APP_NAME}-db-${APP_ENV}
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - default
    volumes:
      - database_data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
  caddy_data:
  caddy_config:
  database_data:
