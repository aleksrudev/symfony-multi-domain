services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Application Query Handlers
    App\Catalog\Application\Query\GetProducts\GetProductsHandler:
        tags:
            - { name: messenger.message_handler, bus: query.bus }

    App\Catalog\Application\Query\GetProduct\GetProductHandler:
        tags:
            - { name: messenger.message_handler, bus: query.bus }

    # Application Command Handlers
    App\Catalog\Application\Command\UpdateProduct\UpdateProductHandler:
        tags:
            - { name: messenger.message_handler, bus: command.bus }

    # Domain Actions
    App\Catalog\Domain\Action\UpdateProductAction: ~

    # Public Contracts Adapter
    App\Catalog\Presentation\Adapter\CatalogContractAdapter: ~
    App\Catalog\Presentation\Contracts\CatalogContractInterface:
        alias: App\Catalog\Presentation\Adapter\CatalogContractAdapter
        public: true

    # Infrastructure Repositories & DataProviders
    App\Catalog\Infrastructure\Persistence\Doctrine\Repository\ProductRepository: ~
    App\Catalog\Domain\Repository\ProductRepositoryInterface:
        alias: App\Catalog\Infrastructure\Persistence\Doctrine\Repository\ProductRepository
        public: true

    App\Catalog\Infrastructure\Persistence\Doctrine\DataProvider\ProductDataProvider: ~
    App\Catalog\Domain\DataProvider\ProductDataProviderInterface:
        alias: App\Catalog\Infrastructure\Persistence\Doctrine\DataProvider\ProductDataProvider
        public: true

    # Presentation Controllers
    App\Catalog\Presentation\Http\Controller\Api\ProductController:
        tags: [controller.service_arguments]

    App\Catalog\Presentation\Http\Controller\Api\AdminProductController:
        tags: [controller.service_arguments]

    # Presentation Error Provider
    App\Catalog\Presentation\Http\Error\CatalogErrorProvider: ~

when@dev:
    services:
        App\Catalog\Infrastructure\Persistence\Doctrine\Fixtures\:
            resource: '../Infrastructure/Persistence/Doctrine/Fixtures/'
            autowire: true
            autoconfigure: true

when@test:
    services:
        App\Catalog\Infrastructure\Persistence\Doctrine\Fixtures\:
            resource: '../Infrastructure/Persistence/Doctrine/Fixtures/'
            autowire: true
            autoconfigure: true
