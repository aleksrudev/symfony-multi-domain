services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Shared\Infrastructure\Bus\Symfony\:
        resource: '../Infrastructure/Bus/Symfony/'

    App\Shared\Infrastructure\Messaging\:
        resource: '../Infrastructure/Messaging/*Handler.php'

    App\Shared\Infrastructure\Schedule\:
        resource: '../Infrastructure/Schedule/'

    App\Shared\Presentation\Http\:
        resource: '../Presentation/Http/*Listener.php'

    App\Shared\Presentation\Http\Error\:
        resource: '../Presentation/Http/Error/*Registry.php'

    App\Shared\Presentation\Http\AuthController:
        tags: [controller.service_arguments]

    App\Shared\Presentation\Http\CsrfProtectionListener:
        tags: [{ name: kernel.event_listener, event: kernel.request, priority: 16 }]
