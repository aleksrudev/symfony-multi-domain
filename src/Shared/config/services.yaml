services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Shared\Infrastructure\Bus\Symfony\:
        resource: '../Infrastructure/Bus/Symfony/'

    App\Shared\Infrastructure\Messaging\IntegrationEvent\:
        resource: '../Infrastructure/Messaging/IntegrationEvent/'

    App\Shared\Infrastructure\Messaging\Messenger\:
        resource: '../Infrastructure/Messaging/Messenger/'
        bind:
            $messageBus: '@event.bus'

    App\Shared\Infrastructure\Messaging\Outbox\:
        resource: '../Infrastructure/Messaging/Outbox/{Writer,Relay,Console}/'

    App\Shared\Infrastructure\Messaging\IdempotentConsumer\Consumer\:
        resource: '../Infrastructure/Messaging/IdempotentConsumer/Consumer/'

    App\Shared\Infrastructure\Schedule\:
        resource: '../Infrastructure/Schedule/'

    App\Shared\Presentation\Http\:
        resource: '../Presentation/Http/*Listener.php'

    App\Shared\Presentation\Http\Error\:
        resource: '../Presentation/Http/Error/*Registry.php'
