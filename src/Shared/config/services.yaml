services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Shared\Infrastructure\Bus\Symfony\:
        resource: '../Infrastructure/Bus/Symfony/'

    App\Shared\Infrastructure\Messaging\IntegrationEvent\:
        resource: '../Infrastructure/Messaging/IntegrationEvent/*Handler.php'

    App\Shared\Infrastructure\Schedule\:
        resource: '../Infrastructure/Schedule/'

    App\Shared\Presentation\Http\:
        resource: '../Presentation/Http/*Listener.php'

    App\Shared\Presentation\Http\Error\:
        resource: '../Presentation/Http/Error/*Registry.php'
