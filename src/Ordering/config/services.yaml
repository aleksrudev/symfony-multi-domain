parameters:
    ordering.scheduler.check_interval: 5
    ordering.scheduler.batch_size: 50

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $checkInterval: '%ordering.scheduler.check_interval%'
            $batchSize: '%ordering.scheduler.batch_size%'

    App\Ordering\Application\:
        resource: '../Application/**/*Handler.php'

    App\Ordering\Domain\Action\:
        resource: '../Domain/Action/'

    App\Ordering\Infrastructure\Integration\:
        resource: '../Infrastructure/Integration/'

    App\Ordering\Infrastructure\Messaging\EventListener\:
        resource: '../Infrastructure/Messaging/EventListener/'

    App\Ordering\Infrastructure\Schedule\:
        resource: '../Infrastructure/Schedule/'

    App\Ordering\Infrastructure\Persistence\Doctrine\Repository\:
        resource: '../Infrastructure/Persistence/Doctrine/Repository/'

    App\Ordering\Infrastructure\Persistence\Doctrine\DataProvider\:
        resource: '../Infrastructure/Persistence/Doctrine/DataProvider/'

    App\Ordering\Presentation\Http\Controller\Api\:
        resource: '../Presentation/Http/Controller/Api/'

    App\Ordering\Presentation\Http\Error\:
        resource: '../Presentation/Http/Error/'
