services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Application Query Handlers
    App\Ordering\Application\Query\GetOrders\GetOrdersHandler:
        tags:
            - { name: messenger.message_handler, bus: query.bus }

    App\Ordering\Application\Query\GetOrder\GetOrderHandler:
        tags:
            - { name: messenger.message_handler, bus: query.bus }

    App\Ordering\Application\Query\GetDraft\GetDraftHandler:
        tags:
            - { name: messenger.message_handler, bus: query.bus }

    # Application Command Handlers
    App\Ordering\Application\Command\CreateDraft\CreateDraftHandler:
        tags:
            - { name: messenger.message_handler, bus: command.bus }

    App\Ordering\Application\Command\ReplaceOrderItems\ReplaceOrderItemsHandler:
        tags:
            - { name: messenger.message_handler, bus: command.bus }

    # Domain Actions
    App\Ordering\Domain\Action\CreateDraftAction: ~
    App\Ordering\Domain\Action\ReplaceOrderItemsAction: ~

    # Infrastructure Repositories & DataProviders
    App\Ordering\Infrastructure\Persistence\Doctrine\Repository\OrderRepository: ~
    App\Ordering\Domain\Repository\OrderRepositoryInterface:
        alias: App\Ordering\Infrastructure\Persistence\Doctrine\Repository\OrderRepository
        public: true

    App\Ordering\Infrastructure\Persistence\Doctrine\DataProvider\OrderDataProvider: ~
    App\Ordering\Domain\DataProvider\OrderDataProviderInterface:
        alias: App\Ordering\Infrastructure\Persistence\Doctrine\DataProvider\OrderDataProvider
        public: true

    App\Ordering\Infrastructure\Persistence\Doctrine\Repository\IdempotencyKeyRepository: ~
    App\Ordering\Domain\Repository\IdempotencyKeyRepositoryInterface:
        alias: App\Ordering\Infrastructure\Persistence\Doctrine\Repository\IdempotencyKeyRepository
        public: true

    App\Ordering\Infrastructure\Persistence\Doctrine\DataProvider\IdempotencyKeyDataProvider: ~
    App\Ordering\Domain\DataProvider\IdempotencyKeyDataProviderInterface:
        alias: App\Ordering\Infrastructure\Persistence\Doctrine\DataProvider\IdempotencyKeyDataProvider
        public: true

    # Presentation Controllers
    App\Ordering\Presentation\Http\Controller\Api\:
        resource: '../Presentation/Http/Controller/Api/'
        tags: ['controller.service_arguments']

    # Presentation Error Provider
    App\Ordering\Presentation\Http\Error\OrderingErrorProvider: ~
